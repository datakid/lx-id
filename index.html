<script>
(function(){try{var s=JSON.parse(localStorage.getItem('raqam-v3')||'{}');var d=s.theme==='dark'||(s.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');if(s.style&&s.style!=='buttery')document.documentElement.setAttribute('data-style',s.style);if(s.lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';}}catch(e){}})();
</script>
